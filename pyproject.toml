[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "transparency-proof-check"
version = "0.1.3"
description = "Bounded offline SHA-256 Merkle inclusion and consistency proof relation checker"
readme = "项目文档/README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["项目文档/LICENSE", "项目文档/NOTICE"]
authors = [{name = "dhtfish98"}]
maintainers = [{name = "dhtfish98"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Topic :: Security"]

[project.scripts]
transparency-proof-check = "transparency_proof_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/transparency-proof-check" = ["项目文档/ORIGIN.md", "项目文档/DEFENSIVE_SCOPE.md", "项目文档/VALIDATION.md", "项目文档/SOURCE_REVIEW.json"]
"share/transparency-proof-check/examples" = ["examples/inclusion-empty-leaf.json", "examples/consistency-same-size.json"]

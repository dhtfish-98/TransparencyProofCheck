name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    defaults:
      run:
        working-directory: ${{ github.workspace }}/Build/源码
    env:
      TMPDIR: ${{ github.workspace }}/Build/临时
      TMP: ${{ github.workspace }}/Build/临时
      TEMP: ${{ github.workspace }}/Build/临时
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/Build/缓存/python
      PIP_CACHE_DIR: ${{ github.workspace }}/Build/缓存/pip
      npm_config_cache: ${{ github.workspace }}/Build/缓存/npm
      RUFF_CACHE_DIR: ${{ github.workspace }}/Build/缓存/ruff
      GOCACHE: ${{ github.workspace }}/Build/缓存/go
      GOMODCACHE: ${{ github.workspace }}/Build/缓存/go-mod
      GOTMPDIR: ${{ github.workspace }}/Build/临时
      GOPATH: ${{ github.workspace }}/Build/缓存/go-path
      GOBIN: ${{ github.workspace }}/Build/输出/go-bin
      CARGO_HOME: ${{ github.workspace }}/Build/缓存/cargo
      XDG_CACHE_HOME: ${{ github.workspace }}/Build/缓存/xdg
      CCACHE_DIR: ${{ github.workspace }}/Build/缓存/ccache
      SCCACHE_DIR: ${{ github.workspace }}/Build/缓存/sccache
      NODE_COMPILE_CACHE: ${{ github.workspace }}/Build/缓存/node
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Stage source and restored project inputs under Build
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} 构建.py --stage --ci
        working-directory: ${{ github.workspace }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test source and build packages
        run: |
          python -m pip install build
          PYTHONPATH=src python -m unittest discover -s tests -v
          python -m build
      - name: Test installed wheel and command outcomes
        run: |
          python -m venv .consumer
          .consumer/bin/python -m pip install --no-deps dist/*.whl
          .consumer/bin/python -m unittest discover -s tests -v
          .consumer/bin/transparency-proof-check examples/inclusion-empty-leaf.json
          .consumer/bin/transparency-proof-check examples/consistency-same-size.json
          .consumer/bin/python - <<'PY'
          import hashlib, json, pathlib, subprocess
          source = pathlib.Path('examples/inclusion-empty-leaf.json')
          document = json.loads(source.read_bytes())
          document['root_hash'] = '00' * 32
          for name, value, expected in [('mismatch', document, 1), ('unsupported', {'schema_version': 77}, 2)]:
              path = pathlib.Path('.consumer') / (name + '.json')
              path.write_text(json.dumps(value))
              before = hashlib.sha256(path.read_bytes()).hexdigest()
              result = subprocess.run(['.consumer/bin/transparency-proof-check', str(path)], capture_output=True, check=False)
              assert result.returncode == expected, result.stdout
              assert not result.stderr, result.stderr
              assert json.loads(result.stdout)['root_authenticity'] == 'OPEN'
              assert before == hashlib.sha256(path.read_bytes()).hexdigest()
          PY
